<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>성서 묵상 동반자</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="app-header">
    <div class="header-brand">
      <span class="brand-icon">📖</span>
      <div class="brand-text">
        <h1 class="brand-title">성서 묵상 동반자</h1>
        <span class="brand-subtitle">Bible Meditation Companion</span>
      </div>
    </div>
    <div class="header-actions">
      <button type="button" class="btn btn-provider-pill" id="btnActiveProviderBadge">
        <span class="provider-dot" id="providerDot"></span>
        <span id="activeModelName">Gemini 3.8 Flash</span>
      </button>
      <button type="button" class="btn btn-icon" id="btnOpenSettings" title="AI 엔진 및 API 키 설정">⚙️</button>
    </div>
  </header>

  <main class="main-container">
    <!-- 섹션 1: 본문 및 1차 초안 묵상 메모 -->
    <section class="card section-draft" id="sectionDraft">
      <div class="card-header">
        <span class="step-badge">1</span>
        <h2>성경 본문 및 1차 초안 메모</h2>
      </div>

      <div class="form-row book-chap-row">
        <div class="form-group flex-1">
          <label for="inputBook">성경 약어 (Book)</label>
          <input type="text" id="inputBook" placeholder="예: Lev, Gen, Rom" spellcheck="false" autocomplete="off">
        </div>
        <div class="form-group flex-1">
          <label for="inputChapter">장 (Chapter)</label>
          <input type="text" id="inputChapter" placeholder="예: 18" spellcheck="false" autocomplete="off">
        </div>
      </div>

      <div class="form-group">
        <label for="inputScripture">성경 본문 구절 (붙여넣기)</label>
        <textarea id="inputScripture" rows="4" placeholder="성경 사이트에서 읽은 구절을 붙여넣으세요..."></textarea>
      </div>

      <div class="form-group">
        <label for="inputDraft">1차 초안 묵상 메모 (자유 기록)</label>
        <textarea id="inputDraft" rows="5" placeholder="떠오른 거친 생각, 의문, 초기 묵상을 자유롭게 기록하세요..."></textarea>
      </div>

      <div class="action-row">
        <button type="button" class="btn btn-primary" id="btnStartDialogue">
          <span class="btn-icon">🎭</span> 돈 까밀로와 대화 시작
        </button>
      </div>
    </section>

    <!-- 섹션 2: 돈 까밀로의 신학적 대화 피드 -->
    <section class="card section-dialogue hidden" id="sectionDialogue">
      <div class="card-header">
        <span class="step-badge">2</span>
        <h2>돈 까밀로와의 신학적 대화</h2>
        <span class="card-hint">형식적 칭찬 없는 도전적 질문</span>
      </div>

      <div class="dialogue-feed" id="dialogueFeed">
        <!-- 대화 말풍선이 동적으로 추가됩니다 -->
      </div>

      <div class="dialogue-input-area" id="dialogueInputArea">
        <textarea id="inputUserReply" rows="2" placeholder="돈 까밀로의 질문에 당신의 생각을 답하세요..."></textarea>
        <div class="dialogue-btn-row">
          <button type="button" class="btn btn-secondary" id="btnSendReply">답변 전송</button>
          <button type="button" class="btn btn-success" id="btnSynthesizeEssay">
            <span class="btn-icon">✍️</span> 에세이 종합하기
          </button>
        </div>
      </div>
    </section>

    <!-- 섹션 3: 완성 묵상 에세이 및 내보내기 -->
    <section class="card section-result hidden" id="sectionResult">
      <div class="card-header">
        <span class="step-badge">3</span>
        <h2>완성 묵상 에세이 종합</h2>
        <span class="badge badge-success" id="lintBadge">린트 검증 대기</span>
      </div>

      <div class="result-toolbar">
        <span class="filename-preview" id="filenamePreview"></span>
      </div>

      <div class="result-editor-wrapper">
        <textarea id="resultMarkdown" rows="16" spellcheck="false"></textarea>
      </div>

      <div class="action-row result-actions">
        <button type="button" class="btn btn-primary" id="btnExportMd">
          <span class="btn-icon">📥</span> Export as MD
        </button>
        <button type="button" class="btn btn-outline" id="btnCopyClipboard">
          <span class="btn-icon">📋</span> 클립보드 복사
        </button>
      </div>
    </section>
  </main>

  <!-- AI 설정 모달 다이얼로그 (Multi-Provider) -->
  <div class="modal-overlay hidden" id="settingsModalOverlay">
    <div class="modal-card">
      <div class="modal-header">
        <h3>⚙️ AI 엔진 및 API 키 설정</h3>
        <button type="button" class="btn-icon" id="btnCloseSettingsModal">✕</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label>사용할 기본 AI 엔진 선택</label>
          <div class="provider-radio-group">
            <label class="radio-label">
              <input type="radio" name="providerSelect" value="gemini" checked>
              <span><strong>Google Gemini</strong> (gemini-3.8-flash · 무료)</span>
            </label>
            <label class="radio-label">
              <input type="radio" name="providerSelect" value="claude">
              <span><strong>Anthropic Claude</strong> (claude-sonnet-5)</span>
            </label>
            <label class="radio-label">
              <input type="radio" name="providerSelect" value="openai">
              <span><strong>OpenAI</strong> (gpt-5.6-luna-max)</span>
            </label>
          </div>
        </div>

        <hr class="modal-divider">

        <!-- Google Gemini 설정 -->
        <div class="provider-config-section" id="cfgSectionGemini">
          <div class="form-group">
            <label for="cfgGeminiKey">Google Gemini API Key (AIzaSy...)</label>
            <input type="password" id="cfgGeminiKey" placeholder="Google AI Studio 무료 키" autocomplete="off">
          </div>
          <div class="form-group">
            <label for="cfgGeminiModel">모델 선택</label>
            <select id="cfgGeminiModel" class="form-select">
              <option value="gemini-3.8-flash" selected>1. Gemini 3.8 Flash High (권장)</option>
              <option value="gemini-3.7-flash">2. Gemini 3.7 Flash High</option>
              <option value="gemini-3.1-pro">3. Gemini 3.1 Pro</option>
            </select>
          </div>
        </div>

        <!-- Anthropic Claude 설정 -->
        <div class="provider-config-section" id="cfgSectionClaude">
          <div class="form-group">
            <label for="cfgClaudeKey">Anthropic Claude API Key (sk-ant-...)</label>
            <input type="password" id="cfgClaudeKey" placeholder="sk-ant-api03-..." autocomplete="off">
          </div>
          <div class="form-group">
            <label for="cfgClaudeModel">모델 선택</label>
            <select id="cfgClaudeModel" class="form-select">
              <option value="claude-sonnet-5" selected>1. Claude Sonnet 5 (권장)</option>
              <option value="claude-opus-5">2. Claude Opus 5</option>
            </select>
          </div>
        </div>

        <!-- OpenAI 설정 -->
        <div class="provider-config-section" id="cfgSectionOpenai">
          <div class="form-group">
            <label for="cfgOpenaiKey">OpenAI API Key (sk-proj-...)</label>
            <input type="password" id="cfgOpenaiKey" placeholder="sk-..." autocomplete="off">
          </div>
          <div class="form-group">
            <label for="cfgOpenaiModel">모델 선택</label>
            <select id="cfgOpenaiModel" class="form-select">
              <option value="gpt-5.6-luna-max" selected>1. GPT 5.6 Luna Max (권장)</option>
              <option value="gpt-5.6-sol">2. GPT 5.6 Sol Medium</option>
              <option value="gpt-6-astra">3. GPT 6 Astra Low</option>
            </select>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline" id="btnCancelSettings">취소</button>
        <button type="button" class="btn btn-primary" id="btnSaveSettings">저장하기</button>
      </div>
    </div>
  </div>

  <!-- 로딩 오버레이 -->
  <div class="loading-overlay hidden" id="loadingOverlay">
    <div class="spinner"></div>
    <p class="loading-text" id="loadingText">사유를 심화하고 있습니다...</p>
  </div>

  <!-- 토스트 알림 -->
  <div class="toast hidden" id="toast"></div>

  <script type="module" src="main.js"></script>
</body>
</html>
